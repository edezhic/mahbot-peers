[package]
name = "mahbot-peers"
version = "0.1.0"
authors = ["edezhic <edezhic@gmail.com>"]
description = "Direct peer layer between mahbot instances: identity, QUIC transport over raw public keys, the beacon, rights, and peer messages."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edezhic/mahbot-peers"
homepage = "https://github.com/edezhic/mahbot-peers"
readme = "README.md"
keywords = ["p2p", "quic", "agent"]
categories = ["network-programming"]
rust-version = "1.96"
# Not part of the package the registry builds: the test harness, the beacon
# library and its server, the Windows type-check crate, this checkout's toolchain
# file, its ignore list and the plan kept beside it. The member paths are anchored:
# an unanchored `beacon` would also match the library's own `src/beacon/`.
exclude = [
    ".DS_Store",
    ".gitignore",
    "PLAN.md",
    "/beacon",
    "/beacon-server",
    "/harness",
    "/windows-check",
    "rust-toolchain.toml",
]

[workspace]
members = ["harness", "beacon", "beacon-server", "windows-check"]
# A workspace root that is also a package defaults to itself alone, which would
# leave `cargo test` at the root running the library and skipping the harness.
# The beacon server's binary is left out on purpose: it is the one package that
# enables quinn's tokio runtime, and building it in the same invocation would
# give the harness's tokio a `time` feature it deliberately does without.
default-members = [".", "harness", "beacon"]

# The Windows access list is read and written by the key-file reader, and by the
# `windows-check` crate that compiles that reader for both Windows targets here; one
# declaration keeps the two from asking for different features.
[workspace.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dependencies]
# QUIC over rustls with raw public keys (RFC 7250). No runtime feature: the
# library is handed a `quinn::Runtime` and a socket by its caller, and must not
# pull a runtime (or a timer driver) into a consumer's graph.
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring"] }
# Not an API: a floor. 0.11.19 is the lowest `quinn-proto` release with no open
# RustSec advisory, and naming it here keeps a lock update from settling below
# it. Default features are off so the pin does not turn on the `bloom`/`log` set
# that `quinn` deliberately leaves off.
quinn-proto = { version = "0.11.19", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
# Creating the key file: a temporary file beside it, flushed, published by an
# operation that fails when the name exists. `tempfile` is the crate that does
# that portably — `renameatx_np` with `RENAME_EXCL` on macOS, `renameat2` with
# `RENAME_NOREPLACE` on Linux where the kernel has it, `MoveFileEx` without replace
# on Windows, or a hard link when the platform call is not usable — and it creates the
# file with mode 0600 on unix. Writing it by hand is where the half-written key
# would come from.
tempfile = "3"

# The account that decides who besides the owner may read the key file —
# `geteuid`, and `getpwuid_r`/`passwd` to name a uid — plus the open flags that
# make a link or a FIFO a refusal rather than a wait (`O_NOFOLLOW`, `O_NONBLOCK`)
# and the error codes those checks answer with (`ELOOP` for a link; `ENOENT`,
# `ENOTSUP` and `EOPNOTSUPP` when a macOS file has no extended list or its volume
# has no ACLs). It declares none of the six Darwin declarations the macOS reader
# needs — the five `sys/acl.h` calls and `mbr_uuid_to_id` from `<membership.h>` —
# which `src/identity/access/unix.rs` declares itself.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The DACL of the key file: which accounts may read it is a Windows access list,
# not a mode, so keeping the file private means writing and reading one.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
